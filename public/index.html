<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="toast-container"></div>
    <main>
      <h1>Todos Kanban Board</h1>
      <form id="add-form">
        <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <p id="error" role="alert" hidden></p>
      
      <div id="filter-bar" class="filter-bar"></div>

      <div class="kanban-board">
        <div id="no-todos-msg" class="no-todos-msg" style="display: none;">No todos with this tag.</div>
        
        <div class="kanban-column" id="col-todo" data-status="todo">
          <h2>Todo</h2>
          <div class="kanban-cards" id="list-todo"></div>
        </div>
        
        <div class="kanban-column" id="col-inprogress" data-status="in-progress">
          <h2>In Progress</h2>
          <div class="kanban-cards" id="list-inprogress"></div>
        </div>
        
        <div class="kanban-column" id="col-done" data-status="done">
          <h2>Done</h2>
          <div class="kanban-cards" id="list-done"></div>
        </div>
      </div>

      <section id="audit-trail-panel">
        <h2>Audit Trail</h2>
        <div class="audit-header">
          <span>Timestamp</span>
          <span>Operation</span>
          <span>Old Text/Status</span>
          <span>New Text/Status</span>
        </div>
        <ul id="audit-log"></ul>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
